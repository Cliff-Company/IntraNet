<!DOCTYPE html>
<html lang="es">

  <script src="js/script.js" defer></script>
</head>

<body>
  <!-- 🔸 NAVBAR -->

        <img src="img/logo.png" alt="ProCliff Logo" class="logo" />
      </a>
    </div>
  </header>

  <!-- 🔸 CONTENIDO PRINCIPAL -->
  <main>
    <section id="inicio">
      <h2>Bienvenido</h2>
      <p>
        Esta plataforma está diseñada para compartir materiales de capacitación
        y reforzar el conocimiento de todo el equipo de Cliff and Company.
      </p>
    </section>

    <section id="videos">
      <h2>Videos de Capacitación</h2>
      <div class="video-grid">
        <div class="video-item">
          <iframe

  <footer>

  </footer>

    <canvas id="snow" style="position: fixed; top:0; left:0; pointer-events:none; z-index:999999;"></canvas>

<script>
  const canvas = document.getElementById("snow");
  const ctx = canvas.getContext("2d");

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  const particles = [];
  const maxParticles = 150;

  function random(min, max) { return Math.random() * (max - min) + min; }

  class Snow {
    constructor() {
      this.x = random(0, width);
      this.y = random(0, height);
      this.radius = random(1, 4);
      this.speed = random(0.5, 2);
      this.wind = random(-0.5, 0.5);
    }

    update() {
      this.y += this.speed;
      this.x += this.wind;

      if (this.y > height) {
        this.y = -5;
        this.x = random(0, width);
      }
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = "white";
      ctx.fill();
    }
  }

  function loop() {
    ctx.clearRect(0, 0, width, height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
  }

  for (let i = 0; i < maxParticles; i++) {
    particles.push(new Snow());
  }

  loop();

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });
</script>
</body>
</html>
